name: POC-14 Shot Intent Checks

on:
  push:
    branches:
      - poc-14-shot-intent-shotmaking
  pull_request:
    branches:
      - main

jobs:
  shot-intent:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project
        run: ./godot --headless --editor --path . --quit

      - name: Run POC-14A shot intent catalog tests
        run: timeout 90s ./godot --headless --path . --script res://tests/shot_intent_catalog_test.gd
