name: POC-18 Authored Course Round Checks

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review
  workflow_dispatch:

jobs:
  poc18:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Run POC-18A authored round integration
        run: godot --headless --path . --script res://tests/authored_round_integration_test.gd

      - name: Run POC-18B stepwise round progression
        run: godot --headless --path . --script res://tests/authored_round_stepwise_progression_test.gd

      - name: Run POC-18C round persistence
        run: godot --headless --path . --script res://tests/authored_round_persistence_test.gd

      - name: Run POC-18D full 18-hole authored round
        run: godot --headless --path . --script res://tests/authored_full_round_stress_test.gd

      - name: Run POC-18F personality strategy diagnostic
        run: godot --headless --path . --script res://tests/course_strategy_personality_diagnostic.gd

      - name: Run POC-18F hazard corridor edge regression
        run: godot --headless --path . --script res://tests/hazard_corridor_edge_proximity_test.gd

      - name: Run POC-18F aggressive strategy memory propagation
        run: godot --headless --path . --script res://tests/aggressive_strategy_memory_propagation_test.gd
